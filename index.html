<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cigar Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@500;700&display=swap">
<style>
/* Layout: one full-bleed canvas stage; DOM cards float over it for start / game over. Single dusk-sandstone world. */
:root{
  --ink:#1d1526;
  --dusk:#2b1f3d;
  --sand:#e8b56f;
  --ember:#ff7a3d;
  --cream:#fbeedd;
  --smoke:#cfc8d6;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--ink);color:var(--cream);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;width:100%;height:100%;touch-action:none;cursor:pointer;overflow:hidden}
#game{display:block;width:100%;height:100%}
.layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at center,rgba(29,21,38,.35),rgba(29,21,38,.7))}
.card{width:min(380px,100%);background:rgba(29,21,38,.9);border:2px solid var(--sand);border-radius:20px;
  padding:26px 24px 22px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;
  box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 0 0 4px rgba(232,181,111,.12);cursor:default}
.card h1,.card h2{font-family:var(--display);font-weight:400;margin:0;line-height:1;text-wrap:balance;letter-spacing:.01em}
.card h1{font-size:clamp(44px,12vw,60px);color:var(--sand);text-shadow:0 4px 0 #7a4a2a}
.card h2{font-size:40px;color:var(--cream)}
.card p{margin:0;font-size:15px;line-height:1.5;color:var(--smoke);max-width:30ch}
.tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ember);font-weight:700}
.portrait{width:120px;height:auto;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5));animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.stat{background:rgba(232,181,111,.1);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--smoke)}
.stat b{font-family:var(--display);font-weight:400;font-size:34px;color:var(--cream);font-variant-numeric:tabular-nums}
.rank{font-family:var(--display);font-size:22px;color:var(--ember)}
.new{color:var(--sand);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.btn{font-family:var(--display);font-size:24px;color:var(--ink);background:var(--sand);border:0;border-radius:14px;
  padding:12px 34px 10px;cursor:pointer;box-shadow:0 5px 0 #7a4a2a;transition:transform .08s, box-shadow .08s}
.btn:hover{background:#f2c584}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #7a4a2a}
.btn:focus-visible,.icon:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.keys{font-size:12px;color:var(--smoke);opacity:.8}
kbd{font-family:var(--body);font-size:11px;border:1px solid rgba(207,200,214,.5);border-radius:5px;padding:1px 6px}
.icon{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));
  width:42px;height:42px;border-radius:50%;border:2px solid rgba(232,181,111,.6);background:rgba(29,21,38,.6);
  color:var(--cream);font-size:18px;display:grid;place-items:center;cursor:pointer;z-index:5;padding:0}
.icon svg{width:20px;height:20px}
@media (prefers-reduced-motion:reduce){.portrait{animation:none}}
</style>

</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="Cigar Rush game area"></canvas>

  <button class="icon" id="mute" aria-label="Mute sound" title="Sound on/off">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path id="waves" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path id="xmark" d="M16 9l5 6M21 9l-5 6" hidden/></svg>
  </button>

  <div class="layer" id="startLayer">
    <div class="card">
      <img class="portrait" id="startHead" alt="">
      <div class="tag">Smoke break, airborne</div>
      <h1>Cigar Rush</h1>
      <p>Tap, click or hit Space to puff upward. Slip between the stone pillars and grab every loose cigar for a bonus.</p>
      <button class="btn" id="startBtn">Light it up</button>
      <div class="keys"><kbd>Space</kbd> / <kbd>↑</kbd> fly &nbsp;·&nbsp; <kbd>P</kbd> pause &nbsp;·&nbsp; Best: <b id="bestStart">0</b></div>
    </div>
  </div>

  <div class="layer" id="overLayer" hidden>
    <div class="card">
      <div class="tag">Extinguished</div>
      <h2>Game over</h2>
      <div class="rank" id="rank">Slow burn</div>
      <div class="stats">
        <div class="stat"><span>Score</span><b id="scoreOut">0</b></div>
        <div class="stat"><span>Best</span><b id="bestOut">0</b></div>
      </div>
      <div class="new" id="newBest" hidden>New personal best</div>
      <button class="btn" id="againBtn">Play again</button>
      <div class="keys">Cigars grabbed this run: <b id="cigarsOut">0</b></div>
    </div>
  </div>
</div>

const H = 640, GROUND = 58, PW = 78;
const stage = document.getElementById('stage');
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const $ = id => document.getElementById(id);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const head = new Image(); head.src = HEAD_SRC;
$('startHead').src = HEAD_SRC;
const HW = 74, HHt = 84;            // drawn head size
const HR = 27;                       // hit radius (forgiving)

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let best = store.get('cigarRush.best', 0);
let muted = store.get('cigarRush.muted', false);
$('bestStart').textContent = best;

/* ---------- sizing ---------- */
let W = 480, scale = 1, dpr = 1, farTile = null;
function resize(){
  const r = stage.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width = Math.round(r.width * dpr); cvs.height = Math.round(r.height * dpr);
  scale = r.height / H; W = r.width / scale;
  buildFarTile();
}
window.addEventListener('resize', resize);

/* far cathedral arcade, pre-rendered once per resize */
const TILE = 240;
function buildFarTile(){
  const k = scale * dpr;
  const c = document.createElement('canvas');
  c.width = Math.ceil(TILE * k); c.height = Math.ceil(H * k);
  const g = c.getContext('2d'); g.scale(k, k);
  const top = 150, spring = 330, floor = H - GROUND;
  g.fillStyle = '#3a2944'; g.fillRect(0, top, TILE, floor - top);
  g.fillStyle = '#33233d'; g.fillRect(0, top, TILE, 14);
  g.globalCompositeOperation = 'destination-out';
  const L = 46, R = 194, span = R - L;
  g.beginPath();
  g.moveTo(L, floor); g.lineTo(L, spring);
  const ang = Math.acos((span / 2) / span);
  g.arc(R, spring, span, Math.PI, Math.PI + ang);
  g.arc(L, spring, span, -ang, 0);
  g.lineTo(R, floor); g.closePath(); g.fill();
  [0, TILE].forEach(x => { g.beginPath(); g.arc(x, 205, 17, 0, Math.PI * 2); g.fill(); });
  g.globalCompositeOperation = 'source-over';
  g.strokeStyle = 'rgba(255,200,140,.10)'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(L, floor); g.lineTo(L, spring); g.arc(R, spring, span, Math.PI, Math.PI + ang); g.stroke();
  farTile = c;
}

/* ---------- audio ---------- */
let actx = null;
function beep(freq, dur, type = 'sine', vol = .12, slide = 0){
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime, o = actx.createOscillator(), gn = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(gn).connect(actx.destination); o.start(t); o.stop(t + dur + .02);
  } catch(e){}
}
const sfx = {
  flap(){ beep(320, .12, 'triangle', .08, 260); },
  point(){ beep(880, .09, 'square', .05); setTimeout(() => beep(1320, .08, 'square', .04), 60); },
  cigar(){ beep(523, .1, 'triangle', .1); setTimeout(() => beep(784, .1, 'triangle', .1), 70); setTimeout(() => beep(1046, .16, 'triangle', .1), 140); },
  hit(){ beep(160, .35, 'sawtooth', .12, -110); }
};
function paintMute(){
  $('waves').hidden = muted; $('xmark').hidden = !muted;
  $('mute').setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
}
paintMute();
$('mute').addEventListener('pointerdown', e => e.stopPropagation());
$('mute').addEventListener('click', e => { e.stopPropagation(); muted = !muted; store.set('cigarRush.muted', muted); paintMute(); });

/* ---------- state ---------- */
let state = 'ready';   // ready | play | dying | over
let paused = false;
let p, pillars, cigars, smoke, sparks, popups, score, cigarCount, speed, sinceSpawn, lastGapY, scrollX, shake, t, overAt;
function reset(){
  p = { x: 0, y: H * 0.42, vy: 0, rot: 0 };
  pillars = []; cigars = []; smoke = []; sparks = []; popups = [];
  score = 0; cigarCount = 0; speed = 190; sinceSpawn = 200; lastGapY = H * 0.45; shake = 0;
}
reset(); scrollX = 0; t = 0;

function headX(){ return Math.min(W * 0.28, 170); }
function gapSize(){ return Math.max(150, 205 - score * 1.6); }

function flap(){
  p.vy = -500; sfx.flap();
  for (let i = 0; i < 4; i++) puff(true);
}
function start(){
  reset(); state = 'play'; paused = false;
  $('startLayer').hidden = true; $('overLayer').hidden = true;
  stage.focus?.();
  flap();
}
function gameOver(){
  state = 'over'; overAt = performance.now();
  const isNew = score > best;
  if (isNew){ best = score; store.set('cigarRush.best', best); }
  $('scoreOut').textContent = score; $('bestOut').textContent = best; $('bestStart').textContent = best;
  $('cigarsOut').textContent = cigarCount;
  $('newBest').hidden = !(isNew && score > 0);
  $('rank').textContent = score >= 40 ? 'Havana legend' : score >= 25 ? 'Smooth draw' : score >= 12 ? 'Slow burn' : score >= 5 ? 'Freshly lit' : 'Barely lit';
  $('overLayer').hidden = false;
  setTimeout(() => $('againBtn').focus({ preventScroll: true }), 50);
}

/* ---------- input ---------- */
function press(){
  if (paused){ paused = false; return; }
  if (state === 'play') flap();
  else if (state === 'ready') start();
  else if (state === 'over' && performance.now() - overAt > 500) start();
}
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('.card')) return;
  e.preventDefault(); press();
});
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW'){
    if (e.target.tagName === 'BUTTON' && state !== 'play') return; // let focused buttons handle it
    e.preventDefault(); if (!e.repeat) press();
  } else if (e.code === 'KeyP' && state === 'play'){ paused = !paused; }
  else if (e.code === 'KeyM'){ $('mute').click(); }
});
$('startBtn').addEventListener('click', start);
$('againBtn').addEventListener('click', () => { if (performance.now() - overAt > 300) start(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });

/* ---------- spawning ---------- */
function spawn(){
  const g = gapSize();
  const minY = 90 + g / 2, maxY = H - GROUND - 70 - g / 2;
  let y = lastGapY + (Math.random() * 2 - 1) * 170;
  y = Math.max(minY, Math.min(maxY, y));
  lastGapY = y;
  const x = W + 40;
  pillars.push({ x, gy: y, g, scored: false, seed: Math.random() });
  if (Math.random() < 0.55){
    const cy = Math.max(70, Math.min(H - GROUND - 50, y + (Math.random() * 2 - 1) * 90));
    cigars.push({ x: x + PW + 140, y: cy, ph: Math.random() * 6 });
  }
}

/* ---------- particles ---------- */
function tipPos(){
  const lx = HW * 0.53, ly = HHt * 0.30;
  const c = Math.cos(p.rot), s = Math.sin(p.rot);
  return { x: p.x + lx * c - ly * s, y: p.y + lx * s + ly * c };
}
function puff(big){
  const tp = tipPos();
  smoke.push({ x: tp.x, y: tp.y, vx: -speed * 0.55 + (Math.random() * 30 - 15), vy: -20 - Math.random() * 30,
    r: big ? 6 : 3 + Math.random() * 3, life: 0, max: 1 + Math.random() * .6 });
}
function burst(x, y, n, colors){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 220;
    sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: .5 + Math.random() * .5, c: colors[i % colors.length] });
  }
}

/* ---------- collision ---------- */
function circleRect(cx, cy, r, x, y, w, h){
  const nx = Math.max(x, Math.min(cx, x + w)), ny = Math.max(y, Math.min(cy, y + h));
  return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;
}
function hitTest(){
  const cx = p.x - 2, cy = p.y + 2;
  if (cy + HR > H - GROUND) return true;
  for (const q of pillars){
    if (q.x - 12 > cx + HR || q.x + PW + 12 < cx - HR) continue;
    const top = q.gy - q.g / 2, bot = q.gy + q.g / 2;
    if (circleRect(cx, cy, HR, q.x, -200, PW, top + 200 - 24)) return true;
    if (circleRect(cx, cy, HR, q.x - 9, top - 24, PW + 18, 24)) return true;
    if (circleRect(cx, cy, HR, q.x - 9, bot, PW + 18, 24)) return true;
    if (circleRect(cx, cy, HR, q.x, bot + 24, PW, H)) return true;
  }
  return false;
}

/* ---------- update ---------- */
let smokeClock = 0;
function update(dt){
  t += dt;
  p.x = headX();
  const moving = state === 'play' || state === 'ready';
  if (moving) scrollX += speed * dt;

  if (state === 'ready'){
    p.y = H * 0.42 + Math.sin(t * 2.6) * 12; p.rot = Math.sin(t * 1.3) * .08;
  } else if (state === 'play'){
    speed = 190 + Math.min(score, 45) * 3.2;
    p.vy = Math.min(p.vy + 1650 * dt, 720);
    p.y += p.vy * dt;
    if (p.y < 30){ p.y = 30; p.vy = Math.max(p.vy, 0); }
    const target = Math.max(-0.42, Math.min(1.1, p.vy / 820));
    p.rot += (target - p.rot) * Math.min(1, dt * 10);

    sinceSpawn += speed * dt;
    if (sinceSpawn >= 285){ sinceSpawn = 0; spawn(); }
    for (const q of pillars){
      q.x -= speed * dt;
      if (!q.scored && q.x + PW < p.x - HR){ q.scored = true; score++; sfx.point(); }
    }
    pillars = pillars.filter(q => q.x > -PW - 40);
    for (const c of cigars){
      c.x -= speed * dt; c.ph += dt * 3;
      if (!c.taken && Math.hypot(c.x - p.x, c.y + Math.sin(c.ph) * 8 - p.y) < HR + 22){
        c.taken = true; score += 3; cigarCount++; sfx.cigar();
        burst(c.x, c.y, 18, ['#ff7a3d', '#ffd36b', '#e8b56f']);
        popups.push({ x: c.x, y: c.y - 20, text: '+3', life: 0 });
      }
    }
    cigars = cigars.filter(c => c.x > -60 && !c.taken);
    if (hitTest()){
      state = 'dying'; sfx.hit(); p.vy = -300;
      if (!reduceMotion) shake = 14;
      burst(p.x, p.y, 24, ['#cfc8d6', '#ff7a3d', '#fbeedd']);
    }
  } else if (state === 'dying'){
    p.vy = Math.min(p.vy + 1900 * dt, 900); p.y += p.vy * dt; p.rot += dt * 9;
    if (p.y > H - GROUND - 30){ p.y = H - GROUND - 30; gameOver(); }
  }

  if (state === 'play' || state === 'ready'){
    smokeClock += dt;
    while (smokeClock > 0.045){ smokeClock -= 0.045; puff(false); }
  }
  for (const s of smoke){ s.life += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.r += dt * 14; }
  smoke = smoke.filter(s => s.life < s.max);
  for (const s of sparks){ s.life += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 500 * dt; }
  sparks = sparks.filter(s => s.life < s.max);
  for (const u of popups){ u.life += dt; u.y -= 40 * dt; }
  popups = popups.filter(u => u.life < .9);
  shake = Math.max(0, shake - dt * 40);
}

/* ---------- draw ---------- */
const stars = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random() * 0.45, r: Math.random() * 1.4 + .3, tw: Math.random() * 6 }));
function drawSky(){
  const g = ctx.createLinearGradient(0, 0, 0, H - GROUND);
  g.addColorStop(0, '#1f1730'); g.addColorStop(.45, '#4a2d52'); g.addColorStop(.8, '#c46a4e'); g.addColorStop(1, '#f2a65e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of stars){
    ctx.globalAlpha = .35 + .35 * Math.sin(t * 1.5 + s.tw);
    ctx.fillStyle = '#fbeedd'; ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const sx = W * 0.72, sy = H - GROUND - 120;
  const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 260);
  sg.addColorStop(0, 'rgba(255,214,140,.85)'); sg.addColorStop(.25, 'rgba(255,170,100,.35)'); sg.addColorStop(1, 'rgba(255,150,90,0)');
  ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);
}
function drawFar(){
  if (!farTile) return;
  const off = -((scrollX * 0.25) % TILE);
  for (let x = off; x < W; x += TILE) ctx.drawImage(farTile, x, 0, TILE, H);
}
function drawGround(){
  const y = H - GROUND;
  const g = ctx.createLinearGradient(0, y, 0, H);
  g.addColorStop(0, '#8a6446'); g.addColorStop(1, '#4e3527');
  ctx.fillStyle = g; ctx.fillRect(0, y, W, GROUND);
  ctx.fillStyle = '#d6a96c'; ctx.fillRect(0, y, W, 5);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(0, y + 5, W, 3);
  ctx.strokeStyle = 'rgba(40,24,16,.35)'; ctx.lineWidth = 2;
  const off = -(scrollX % 64);
  ctx.beginPath();
  for (let x = off; x < W + 64; x += 64){ ctx.moveTo(x, y + 8); ctx.lineTo(x - 22, H); }
  ctx.moveTo(0, y + 30); ctx.lineTo(W, y + 30);
  ctx.stroke();
}
function shaftGrad(x){
  const g = ctx.createLinearGradient(x, 0, x + PW, 0);
  g.addColorStop(0, '#c99a62'); g.addColorStop(.25, '#f3d39d'); g.addColorStop(.6, '#d9ab6e'); g.addColorStop(1, '#9a6b42');
  return g;
}
function drawPillar(q){
  const top = q.gy - q.g / 2, bot = q.gy + q.g / 2, x = q.x;
  const sg = shaftGrad(x);
  // shafts
  ctx.fillStyle = sg;
  ctx.fillRect(x, -10, PW, top - 24 + 10);
  ctx.fillRect(x, bot + 24, PW, H - GROUND - bot - 24);
  // fluting
  ctx.strokeStyle = 'rgba(110,70,40,.28)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 1; i < 5; i++){
    const fx = x + i * PW / 5;
    ctx.moveTo(fx, -10); ctx.lineTo(fx, top - 24);
    ctx.moveTo(fx, bot + 24); ctx.lineTo(fx, H - GROUND);
  }
  ctx.stroke();
  // mortar joints
  ctx.strokeStyle = 'rgba(90,55,30,.35)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let yy = top - 24 - 70; yy > -10; yy -= 70){ ctx.moveTo(x, yy); ctx.lineTo(x + PW, yy); }
  for (let yy = bot + 24 + 70; yy < H - GROUND; yy += 70){ ctx.moveTo(x, yy); ctx.lineTo(x + PW, yy); }
  ctx.stroke();
  // capitals
  const cap = (cy, flip) => {
    const cg = ctx.createLinearGradient(x - 9, 0, x + PW + 9, 0);
    cg.addColorStop(0, '#b98a5a'); cg.addColorStop(.3, '#f6dcae'); cg.addColorStop(1, '#8f6038');
    ctx.fillStyle = cg;
    ctx.fillRect(x - 9, cy, PW + 18, 24);
    ctx.fillStyle = 'rgba(70,40,20,.35)';
    ctx.fillRect(x - 9, flip ? cy : cy + 20, PW + 18, 4);
    ctx.fillStyle = 'rgba(255,240,210,.35)';
    ctx.fillRect(x - 9, flip ? cy + 20 : cy, PW + 18, 3);
  };
  cap(top - 24, false); cap(bot, true);
  // shadow side edge
  ctx.fillStyle = 'rgba(40,20,10,.25)';
  ctx.fillRect(x + PW - 4, -10, 4, top - 24 + 10);
  ctx.fillRect(x + PW - 4, bot + 24, 4, H - GROUND - bot - 24);
}
function drawCigar(c){
  const y = c.y + Math.sin(c.ph) * 8;
  ctx.save(); ctx.translate(c.x, y); ctx.rotate(-0.25 + Math.sin(c.ph * .7) * .08);
  const pulse = .5 + .5 * Math.sin(t * 6 + c.ph);
  const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, 42);
  glow.addColorStop(0, `rgba(255,190,110,${.35 + pulse * .2})`); glow.addColorStop(1, 'rgba(255,150,80,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, 0, 42, 0, 7); ctx.fill();
  const bg = ctx.createLinearGradient(0, -7, 0, 7);
  bg.addColorStop(0, '#a36a3c'); bg.addColorStop(.5, '#7a4a2a'); bg.addColorStop(1, '#4d2c18');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.roundRect(-26, -7, 50, 14, 7); ctx.fill();
  ctx.fillStyle = '#c0392b'; ctx.fillRect(8, -7, 8, 14);
  ctx.fillStyle = '#f2c94c'; ctx.fillRect(10, -7, 3, 14);
  ctx.fillStyle = '#9a948f'; ctx.fillRect(-29, -6, 5, 12);
  const eg = ctx.createRadialGradient(-29, 0, 1, -29, 0, 9);
  eg.addColorStop(0, '#fff1b8'); eg.addColorStop(.4, '#ff7a3d'); eg.addColorStop(1, 'rgba(255,90,40,0)');
  ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(-29, 0, 9, 0, 7); ctx.fill();
  ctx.restore();
}
function drawHead(){
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.beginPath(); ctx.ellipse(-2, HHt * 0.5, 26, 6, 0, 0, 7); ctx.fill();
  if (head.complete && head.naturalWidth) ctx.drawImage(head, -HW * 0.42, -HHt * 0.48, HW, HHt);
  else { ctx.fillStyle = '#e8b56f'; ctx.beginPath(); ctx.arc(0, 0, HR, 0, 7); ctx.fill(); }
  // ember glow at the tip
  const lx = HW * 0.53, ly = HHt * 0.30;
  const eg = ctx.createRadialGradient(lx, ly, 0, lx, ly, 9);
  eg.addColorStop(0, `rgba(255,220,140,${state === 'play' || state === 'ready' ? .9 : .2})`); eg.addColorStop(1, 'rgba(255,100,40,0)');
  ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(lx, ly, 9, 0, 7); ctx.fill();
  ctx.restore();
}
function drawSmoke(){
  for (const s of smoke){
    const a = (1 - s.life / s.max) * .45;
    ctx.fillStyle = `rgba(214,208,222,${a})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
  }
}
function drawSparks(){
  for (const s of sparks){
    ctx.globalAlpha = 1 - s.life / s.max; ctx.fillStyle = s.c;
    ctx.beginPath(); ctx.arc(s.x, s.y, 3, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function outlinedText(txt, x, y, size, fill){
  ctx.font = `${size}px "Lilita One", "Trebuchet MS", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * .16; ctx.strokeStyle = '#1d1526';
  ctx.strokeText(txt, x, y); ctx.fillStyle = fill; ctx.fillText(txt, x, y);
}
function drawHUD(){
  if (state === 'play' || state === 'dying') outlinedText(String(score), W / 2, 64, 58, '#fbeedd');
  for (const u of popups){
    ctx.globalAlpha = 1 - u.life / .9; outlinedText(u.text, u.x, u.y, 30, '#ffd36b');
  }
  ctx.globalAlpha = 1;
  if (paused){
    ctx.fillStyle = 'rgba(29,21,38,.55)'; ctx.fillRect(0, 0, W, H);
    outlinedText('Paused', W / 2, H / 2 - 16, 52, '#e8b56f');
    outlinedText('Tap or press Space to resume', W / 2, H / 2 + 30, 20, '#fbeedd');
  }
}
function draw(){
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  drawSky(); drawFar();
  for (const q of pillars) drawPillar(q);
  for (const c of cigars) drawCigar(c);
  drawGround();
  drawSmoke(); drawHead(); drawSparks(); drawHUD();
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  if (!paused) update(dt);
  draw();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
})();
</script>

</body>
